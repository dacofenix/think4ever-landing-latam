<meta name="robots" content="noindex, nofollow">
<style>
.idea{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;padding:8px 8px 8px 0}
.idea textarea{grid-column:1;grid-row:1/span 3;height:100%;min-height:120px;padding:6px 8px 4px 16px}
.idea-bar{display:contents}
.idea .tool{grid-column:2;width:36px;height:36px;border-radius:10px;margin-bottom:6px}
.idea .tool[data-tool=code]{grid-row:1}.idea .tool[data-tool=repo]{grid-row:2}.idea .tool[data-tool=mic]{grid-row:3}
.idea .send{grid-column:1/-1;grid-row:4;justify-self:end;margin:0}
.idea .idea-hint{grid-column:1/-1;grid-row:5;padding:8px 16px 2px}
</style>
